; PlatformIO / pioarduino Project Configuration File for DeskOS
; ==============================================================================
; Targets:
;   - wg1200: WeatherXM WG1200 Gateway (ESP32-S3, 16MB Flash, Non-Destructive OTA)
;   - d1l:    Seeed SenseCAP Indicator D1L (ESP32-S3, 8MB Flash)
; ==============================================================================

[platformio]
default_envs = wg1200
src_dir = main
include_dir = main/include

[env]
platform = espressif32
platform_packages =
    framework-espidf @ symlink:///Users/manos/.platformio/packages/framework-espidf
framework = espidf
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_filters = esp32_exception_decoder

; ------------------------------------------------------------------------------
; Environment: WeatherXM WG1200 Gateway
; ------------------------------------------------------------------------------
[env:wg1200]
board = esp32s3box
board_upload.flash_size = 16MB
board_upload.partition_table_offset = 0xc000
board_build.partitions = partitions_wg1200.csv
; The platform ignores board_build.sdkconfig_defaults and would generate
; sdkconfig.wg1200 from sdkconfig.defaults alone (a D1L config: 8 MB, table at
; 0x8000). Pass the WG1200 overlay to ESP-IDF directly.
board_build.cmake_extra_args = "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.wg1200"
build_flags =
    -DCONFIG_LCD_BOARD_SENSECAP_INDICATOR_WXM=1
    -DCONFIG_ESPTOOLPY_FLASHSIZE_16MB=1
; Removes the platform's 0x0 firmware.factory.bin, which would erase the
; WG1200 credentials and factory firmware if flashed.
extra_scripts = post:scripts/pio_wg1200_post.py
; Upload needs an explicit --upload-port and the device MAC in
; WG1200_EXPECTED_MAC; production units also need a Secure Boot signed image.
upload_protocol = custom
upload_speed = 460800
upload_command = "$PYTHONEXE" scripts/flash_wg1200.py --ota ${"-p " + UPLOAD_PORT if UPLOAD_PORT else ""}

; ------------------------------------------------------------------------------
; Environment: Seeed SenseCAP Indicator D1L
; ------------------------------------------------------------------------------
[env:d1l]
board = esp32s3box
board_upload.flash_size = 8MB
board_build.partitions = partitions_d1l.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags =
    -DCONFIG_LCD_BOARD_SENSECAP_INDICATOR_D1L=1
upload_speed = 921600
upload_protocol = esptool
