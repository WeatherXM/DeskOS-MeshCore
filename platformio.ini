; PlatformIO / pioarduino Project Configuration File for DeskOS
; ==============================================================================
; Targets:
;   - wg1200: WeatherXM WG1200 Gateway (ESP32-S3, 16MB Flash, Non-Destructive OTA)
;   - d1l:    Seeed SenseCAP Indicator D1L (ESP32-S3, 8MB Flash)
; ==============================================================================

[platformio]
default_envs = wg1200
src_dir = main
include_dir = main/include

[env]
platform = espressif32
platform_packages =
    framework-espidf @ symlink:///Users/manos/.platformio/packages/framework-espidf
framework = espidf
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_filters = esp32_exception_decoder

; ------------------------------------------------------------------------------
; Environment: WeatherXM WG1200 Gateway
; ------------------------------------------------------------------------------
[env:wg1200]
board = esp32s3box
board_upload.flash_size = 16MB
board_upload.partition_table_offset = 0xc000
board_build.partitions = partitions_wg1200.csv
board_build.sdkconfig_defaults = sdkconfig.defaults sdkconfig.defaults.wg1200
build_flags =
    -DCONFIG_LCD_BOARD_SENSECAP_INDICATOR_WXM=1
    -DCONFIG_ESPTOOLPY_FLASHSIZE_16MB=1
upload_protocol = custom
upload_speed = 460800
upload_command = "$PYTHONEXE" scripts/flash_wg1200.py --ota ${UPLOAD_PORT:+-p $UPLOAD_PORT}

; ------------------------------------------------------------------------------
; Environment: Seeed SenseCAP Indicator D1L
; ------------------------------------------------------------------------------
[env:d1l]
board = esp32s3box
board_upload.flash_size = 8MB
board_build.partitions = partitions_d1l.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags =
    -DCONFIG_LCD_BOARD_SENSECAP_INDICATOR_D1L=1
upload_speed = 921600
upload_protocol = esptool
